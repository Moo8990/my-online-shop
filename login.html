<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - متجري</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 2rem 1rem;
      }

      .auth-box {
        background: white;
        padding: 3rem 2.5rem;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
        animation: slideUp 0.5s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .auth-box .logo {
        text-align: center;
        font-size: 2rem;
        color: #667eea;
        margin-bottom: 0.5rem;
      }

      .auth-box h1 {
        text-align: center;
        color: #1a1a2e;
        margin-bottom: 0.5rem;
        font-size: 1.6rem;
      }

      .auth-box .subtitle {
        text-align: center;
        color: #999;
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .tabs {
        display: flex;
        margin-bottom: 2rem;
        background: #f0f0f0;
        border-radius: 10px;
        padding: 5px;
      }

      .tab {
        flex: 1;
        padding: 0.7rem;
        text-align: center;
        cursor: pointer;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s;
        color: #666;
      }

      .tab.active {
        background: white;
        color: #667eea;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .form-group {
        margin-bottom: 1.2rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #1a1a2e;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .form-group input {
        width: 100%;
        padding: 0.9rem 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: border-color 0.3s;
        outline: none;
        font-family: inherit;
      }

      .form-group input:focus {
        border-color: #667eea;
      }

      .auth-btn {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: bold;
        cursor: pointer;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        margin-top: 0.5rem;
      }

      .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      .auth-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .error-msg {
        background: #fee;
        color: #c33;
        padding: 0.8rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
        display: none;
        border-right: 4px solid #c33;
      }

      .success-msg {
        background: #efe;
        color: #2a7;
        padding: 0.8rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
        display: none;
        border-right: 4px solid #2a7;
      }

      .hidden {
        display: none !important;
      }

      .back-home {
        text-align: center;
        margin-top: 1.5rem;
      }

      .back-home a {
        color: #667eea;
        text-decoration: none;
        font-size: 0.95rem;
      }

      .back-home a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <div class="logo">
          <i class="fas fa-store"></i>
        </div>
        <h1 id="pageTitle">مرحباً بك مجدداً</h1>
        <p class="subtitle" id="pageSubtitle">سجل دخولك للمتابعة</p>

        <div class="tabs">
          <div class="tab active" id="loginTab">تسجيل الدخول</div>
          <div class="tab" id="registerTab">حساب جديد</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm">
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input
              type="email"
              id="loginEmail"
              required
              placeholder="you@example.com"
            />
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input
              type="password"
              id="loginPassword"
              required
              placeholder="••••••••"
            />
          </div>
          <button type="submit" class="auth-btn" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
          </button>
        </form>

        <form id="registerForm" class="hidden">
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input
              type="text"
              id="registerName"
              required
              placeholder="اسمك الكامل"
            />
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input
              type="email"
              id="registerEmail"
              required
              placeholder="you@example.com"
            />
          </div>
          <div class="form-group">
            <label>رقم الهاتف (مصري)</label>
            <input
              type="tel"
              id="registerPhone"
              required
              placeholder="01xxxxxxxxx"
              maxlength="11"
              pattern="01[0125][0-9]{8}"
            />
            <small
              style="
                color: #999;
                font-size: 0.85rem;
                display: block;
                margin-top: 0.3rem;
              "
            >
              <i class="fas fa-info-circle"></i> يجب أن يبدأ بـ 010، 011، 012،
              أو 015
            </small>
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input
              type="password"
              id="registerPassword"
              required
              placeholder="••••••••"
              minlength="6"
            />
          </div>
          <button type="submit" class="auth-btn" id="registerBtn">
            <i class="fas fa-user-plus"></i> إنشاء الحساب
          </button>
        </form>

        <div class="back-home">
          <a href="index.html"
            ><i class="fas fa-arrow-right"></i> العودة للمتجر</a
          >
        </div>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
